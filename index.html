<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marco Vargas</title>
  <meta name="description" content="Marco Vargas is an architect based in Portugal." />
  <meta name="keywords" content="Marco Vargas, arquitecto, arquitectura, architect, architecture, Portugal, Villa Mater: a house in Azores, FAUP." />
  <meta name="author" content="Marco Vargas" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.marcovargas.pt/" />
  <meta property="og:type" content="profile" />
  <meta property="og:title" content="Marco Vargas" />
  <meta property="og:description" content="Marco Vargas is an architect based in Portugal." />
  <meta property="og:url" content="https://www.marcovargas.pt/" />
  <meta property="og:locale" content="pt_PT" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Marco Vargas",
    "jobTitle": "Architect",
    "url": "https://www.marcovargas.pt",
    "email": "mail@marcovargas.pt"
  }
  </script>
  <style>
    @font-face {
      font-family: "Nimbus Sans L";
      src: url("./NimbusSansL-Reg.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
    }
    html {
      font-size: 16px;
    }
    @media (min-width: 900px) {
      html {
        font-size: 20px;
      }
    }
    :root {
      --link-blue: #0645ea;
      --gutter: max(24px, min(4vw, 80px));
    }
    body {
      background: #ffffff;
      color: #000000;
      font-family: "Nimbus Sans L", sans-serif;
      font-weight: 400;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* ---- Layout ---- */
    .page {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: var(--gutter);
    }
    .sidebar {
      flex-shrink: 0;
    }
    .main {
      margin-top: 0;
    }

    @media (min-width: 900px) {
      .page {
        flex-direction: row;
        align-items: flex-start;
        padding: 0;
      }
      .sidebar {
        position: fixed;
        top: 60px;
        left: 100px;
        width: 260px;
      }
      .main {
        margin-top: 60px;
        margin-left: 400px;
        max-width: 700px;
      }
    }

    /* ---- Sidebar content ---- */
    .name-row,
    .role-line {
      margin-bottom: 0;
      letter-spacing: 0.03em;
    }
    .name-row a {
      color: #000000;
    }
    .name-row a:hover,
    .name-row a:focus-visible,
    .name-row a:active {
      color: var(--link-blue);
    }
    .contact-block {
      margin-top: 0;
    }
    .contact-block a {
      display: block;
    }
    .nav {
      margin-top: 48px;
    }
    .nav a {
      display: block;
    }

    /* ---- Links ---- */
    a {
      color: inherit;
      text-decoration: none;
    }
    .contact-block a,
    .nav a {
      color: #000000;
    }
    .contact-block a:hover,
    .contact-block a:focus-visible,
    .contact-block a:active,
    .nav a:hover,
    .nav a:focus-visible,
    .nav a:active {
      color: var(--link-blue);
    }
    .nav a.active {
      color: var(--link-blue);
    }
    .about-content.open {
      display: block;
    }
    .about-content p {
      margin: 0 0 24px 0;
    }
    .about-content p:last-child {
      margin-bottom: 0;
    }

    .seo-context {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      white-space: nowrap;
      border: 0;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
    }

    /* No desktop, o About fica alinhado com o topo do sidebar (sem espaço extra) */
    @media (min-width: 900px) {
      .about-content {
        margin-top: 0;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="sidebar">
      <div class="name-row"><a href="#" id=>MARCO VARGAS</a></div>
      <div class="role-line">Arquitecto</div>
      <div class="contact-block">
        <a href="mailto:mail@marcovargas.pt">mail@marcovargas.pt</a>
      </div>

  <div class="seo-context">
    Marco Vargas is an architect based in Portugal. His work includes Villa Mater: a House in Azores.
  </div>

  <script>
    var aboutLink = document.getElementById('about-link');
    var aboutContent = document.getElementById('about-content');
    var homeLink = document.getElementById('home-link');

    aboutLink.addEventListener('click', function (e) {
      e.preventDefault();
      var isOpen = aboutContent.classList.toggle('open');
      aboutLink.classList.toggle('active', isOpen);
    });

    homeLink.addEventListener('click', function (e) {
      e.preventDefault();
      aboutContent.classList.remove('open');
      aboutLink.classList.remove('active');
      window.scrollTo(0, 0);
    });
  </script>
</body>
</html>
